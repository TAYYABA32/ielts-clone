name: CI

# Runs on every PR and every push to main. Steps are ordered cheapest/most
# likely-to-fail-first (typecheck -> lint -> test -> build) so a broken PR
# fails in seconds, not minutes, without waiting for a full production build.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel a stale run for the same branch/PR when new commits land, so CI
# minutes aren't spent finishing a build that's already obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default GITHUB_TOKEN permissions are read-only — this workflow only reads
# the repo and reports a status check, so it never needs write access.
permissions:
  contents: read

env:
  # Type checking, linting, `prisma generate`, the test suite, and
  # `next build` all run without a live database or Clerk connection —
  # verified locally with zero env vars set before writing this workflow.
  # No repository secrets are referenced anywhere in this workflow, so none
  # can leak into logs; deploying (as opposed to just verifying the build)
  # would need real credentials wired up separately via GitHub Environments,
  # not this file.
  NODE_VERSION: "20"

jobs:
  ci:
    name: Typecheck, Lint, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # setup-node's built-in npm cache (keyed off package-lock.json)
          # restores ~/.npm so `npm ci` doesn't re-download every package on
          # every run. Preferred over manually caching node_modules directly:
          # that approach can silently serve a stale/platform-mismatched
          # node_modules across cache restores, whereas re-running `npm ci`
          # against a warm npm cache is both fast and always correct.
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          # Falls back to the closest previous cache (restore-keys) on a
          # partial match so most builds still get incremental-compile
          # benefit even after a dependency bump; a full cache miss just
          # means a normal from-scratch build, never a failure.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
