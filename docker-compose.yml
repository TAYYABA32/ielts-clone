services:
  app:
    build: .
    ports:
      - "3000:3000"
    # Copy .env.example to .env and fill in real values (Clerk keys, Supabase
    # Storage, Upstash, Resend, Sentry, NEXT_PUBLIC_APP_URL) before running.
    env_file:
      - .env
    environment:
      # Overrides .env's DATABASE_URL/DIRECT_URL to point at the `postgres`
      # service below — this is the self-hosted-Postgres path. If you're
      # using an external database instead (e.g. Supabase, as this project
      # was built against), delete these two lines and the `postgres`
      # service/volume below, and put your real DATABASE_URL/DIRECT_URL in
      # .env instead. See DEPLOYMENT.md.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ielts_clone
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/ielts_clone
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ielts_clone
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
